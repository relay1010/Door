<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you - DoorDash Merchant Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 99.5 56.5'%3E%3Cpath fill='%23EB1700' d='M95.64,13.38A25.24,25.24,0,0,0,73.27,0H2.43A2.44,2.44,0,0,0,.72,4.16L16.15,19.68a7.26,7.26,0,0,0,5.15,2.14H71.24a6.44,6.44,0,1,1,.13,12.88H36.94a2.44,2.44,0,0,0-1.72,4.16L50.66,54.39a7.25,7.25,0,0,0,5.15,2.14H71.38c20.26,0,35.58-21.66,24.26-43.16'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            color: #191919;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 56px 40px 48px;
            text-align: center;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dd-logo {
            width: 42px;
            height: 24px;
            margin: 0 auto 32px;
            display: block;
        }

        /* Green success checkmark */
        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            display: block;
        }

        .heading {
            font-size: 28px;
            font-weight: 800;
            color: #191919;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .message {
            font-size: 16px;
            color: #606060;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto 32px;
        }

        .message strong {
            color: #191919;
            font-weight: 600;
        }

        /* Redirect countdown */
        .redirect-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            color: #767676;
            background: #f6f6f6;
            border-radius: 24px;
            padding: 10px 20px;
            margin-bottom: 24px;
            max-width: 100%;
        }

        .redirect-info .mini-spinner {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            animation: dd-spin 1.1s linear infinite;
        }

        .redirect-info .mini-spinner .track {
            stroke: #e0e0e0;
        }

        .redirect-info .mini-spinner .arc {
            stroke: #eb1700;
            stroke-linecap: round;
            stroke-dasharray: 60, 200;
        }

        @keyframes dd-spin {
            100% { transform: rotate(360deg); }
        }

        .redirect-info .countdown {
            font-weight: 700;
            color: #191919;
        }

        /* Progress bar */
        .progress-bar {
            width: 100%;
            max-width: 320px;
            height: 4px;
            background: #f6f6f6;
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto;
        }

        .progress-bar .fill {
            height: 100%;
            background: #eb1700;
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Manual link fallback */
        .manual-link {
            margin-top: 28px;
            font-size: 14px;
            color: #767676;
        }

        .manual-link a {
            color: #eb1700;
            font-weight: 600;
            text-decoration: none;
        }

        .manual-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                border: none;
                padding: 32px 0;
                max-width: 100%;
                min-height: auto;
            }
            .heading {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- DoorDash logo -->
        <svg class="dd-logo" aria-hidden="true" viewBox="0 0 99.5 56.5" fill="#EB1700" xmlns="http://www.w3.org/2000/svg">
            <path d="M95.64,13.38A25.24,25.24,0,0,0,73.27,0H2.43A2.44,2.44,0,0,0,.72,4.16L16.15,19.68a7.26,7.26,0,0,0,5.15,2.14H71.24a6.44,6.44,0,1,1,.13,12.88H36.94a2.44,2.44,0,0,0-1.72,4.16L50.66,54.39a7.25,7.25,0,0,0,5.15,2.14H71.38c20.26,0,35.58-21.66,24.26-43.16"/>
        </svg>

        <!-- Green success checkmark -->
        <svg class="success-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="32" cy="32" r="28" fill="#1a8754"/>
            <path d="M20 33 L28 41 L45 24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>

        <h1 class="heading">Thank you</h1>
        <p class="message">
            Thank you for your cooperation.<br>
            Your details are updated and you should keep receiving your payouts without any issues. Thanks again for being a valuable partner.
        </p>

        <!-- Redirect countdown -->
        <div class="redirect-info">
            <svg class="mini-spinner" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle class="track" cx="25" cy="25" r="20" fill="none" stroke-width="5"/>
                <circle class="arc" cx="25" cy="25" r="20" fill="none" stroke-width="5"/>
            </svg>
            <span>Redirecting to Merchant Portal in <span class="countdown" id="countdown">6</span>s</span>
        </div>

        <!-- Progress bar -->
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- Manual fallback link -->
        <p class="manual-link">
            Not redirected? <a href="https://merchant-portal.doordash.com/merchant">Click here</a>
        </p>
    </div>

    <script>
        // ---- Redirect after 6 seconds ----
        const REDIRECT_URL = 'https://merchant-portal.doordash.com/merchant';
        const DURATION = 6000; // 6 seconds in ms

        const countdownEl = document.getElementById('countdown');
        const progressFill = document.getElementById('progressFill');

        const startTime = Date.now();

        // Update countdown + progress bar every 100ms
        const interval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(0, DURATION - elapsed);
            const secondsLeft = Math.ceil(remaining / 1000);
            const percent = Math.min(100, (elapsed / DURATION) * 100);

            countdownEl.textContent = secondsLeft;
            progressFill.style.width = percent + '%';

            if (elapsed >= DURATION) {
                clearInterval(interval);
                window.location.href = REDIRECT_URL;
            }
        }, 100);
    </script>
</body>
</html>
