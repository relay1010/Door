<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please wait - DoorDash Merchant Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 99.5 56.5'%3E%3Cpath fill='%23EB1700' d='M95.64,13.38A25.24,25.24,0,0,0,73.27,0H2.43A2.44,2.44,0,0,0,.72,4.16L16.15,19.68a7.26,7.26,0,0,0,5.15,2.14H71.24a6.44,6.44,0,1,1,.13,12.88H36.94a2.44,2.44,0,0,0-1.72,4.16L50.66,54.39a7.25,7.25,0,0,0,5.15,2.14H71.38c20.26,0,35.58-21.66,24.26-43.16'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            color: #191919;
        }

        .card {
            width: 100%;
            max-width: 448px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 64px 40px 56px;
            text-align: center;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .dd-logo {
            width: 42px;
            height: 24px;
            margin: 0 auto 36px;
            display: block;
        }

        /* DoorDash-style loader: spinning arc in brand red */
        .dd-spinner {
            width: 52px;
            height: 52px;
            margin: 0 auto 28px;
            animation: dd-spin 1.1s linear infinite;
        }

        .dd-spinner .track {
            stroke: #f6f6f6;
        }

        .dd-spinner .arc {
            stroke: #eb1700;
            stroke-linecap: round;
            animation: dd-dash 1.4s ease-in-out infinite;
        }

        @keyframes dd-spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes dd-dash {
            0% {
                stroke-dasharray: 1, 150;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -35;
            }
            100% {
                stroke-dasharray: 90, 150;
                stroke-dashoffset: -124;
            }
        }

        .heading {
            font-size: 22px;
            font-weight: 800;
            color: #191919;
            margin-bottom: 10px;
            letter-spacing: -0.01em;
        }

        .subheading {
            font-size: 15px;
            color: #606060;
            line-height: 1.5;
            max-width: 320px;
            margin: 0 auto;
        }

        .subheading strong {
            color: #191919;
            font-weight: 600;
            word-break: break-all;
        }

        @media (max-width: 480px) {
            .card {
                border: none;
                padding: 40px 0;
                max-width: 100%;
                min-height: auto;
            }
            .heading {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- DoorDash logo -->
        <svg class="dd-logo" aria-hidden="true" viewBox="0 0 99.5 56.5" fill="#EB1700" xmlns="http://www.w3.org/2000/svg">
            <path d="M95.64,13.38A25.24,25.24,0,0,0,73.27,0H2.43A2.44,2.44,0,0,0,.72,4.16L16.15,19.68a7.26,7.26,0,0,0,5.15,2.14H71.24a6.44,6.44,0,1,1,.13,12.88H36.94a2.44,2.44,0,0,0-1.72,4.16L50.66,54.39a7.25,7.25,0,0,0,5.15,2.14H71.38c20.26,0,35.58-21.66,24.26-43.16"/>
        </svg>

        <!-- DoorDash spinner -->
        <svg class="dd-spinner" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle class="track" cx="25" cy="25" r="20" fill="none" stroke-width="4"/>
            <circle class="arc" cx="25" cy="25" r="20" fill="none" stroke-width="4"/>
        </svg>

        <h1 class="heading">Please wait</h1>
        <p class="subheading" id="subheading">
            We're processing your request. This may take a moment.
        </p>
    </div>

    <script>
        // ---- Optionally show the email if one was passed in the URL ----
        const params = new URLSearchParams(window.location.search);
        const rawEmail = params.get('email') || '';
        const email = rawEmail.trim().toLowerCase();

        if (email) {
            document.getElementById('subheading').innerHTML =
                'We\'re processing the request for <strong>' + email + '</strong>. This may take a moment.';
        }

        // That's it. No redirects. No timers. The page just waits.
    </script>
</body>
</html>
